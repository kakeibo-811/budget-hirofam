<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fce4ec" />
  <title>夫婦家計簿 / Budget HiroFam</title>
  <link rel="stylesheet" href="/src/style.css" />
  <script>
    // テーマとロケールの初期化（FOUC防止のため inline）
    (function() {
      var t = localStorage.getItem('theme') || 'pink';
      var l = localStorage.getItem('locale') || 'ja';
      document.documentElement.dataset.theme = t;
      document.documentElement.lang = l;
    })();
  </script>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-left">
        <span class="app-title" data-i18n="app.title">夫婦家計簿</span>
      </div>
      <div class="header-right">
        <select class="lang-select" id="lang-select">
          <option value="ja">日本語</option>
          <option value="en">English</option>
        </select>
        <select class="theme-select" id="theme-select">
          <option value="pink">Pink</option>
          <option value="blue">Blue</option>
          <option value="green">Green</option>
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </div>
    </header>

    <nav class="tab-nav" id="tab-nav">
      <!-- アイコンのみのタブバー、ツールチップで名前表示 -->
    </nav>

    <main class="tab-content" id="tab-content">
      <!-- 各タブの中身がここに描画される -->
    </main>

    <footer class="app-footer">
      <span class="version" id="version-display">v—</span>
    </footer>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
